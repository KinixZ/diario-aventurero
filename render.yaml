# Despliegue en Render (plan gratis): un solo servicio que sirve la web y las salas por WebSocket.
# En Render: New → Blueprint → elige este repo.
services:
  - type: web
    name: diario-aventurero
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Traducción para teléfonos: pon UNA de las dos claves en el panel de Render (Environment).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: TR_CACHE_FILE
        value: /tmp/traducciones.json
