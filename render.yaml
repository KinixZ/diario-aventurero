# Despliegue en Render (plan gratis): un solo servicio que sirve la web y las campañas por WebSocket.
# En Render: New → Blueprint → elige este repo.
services:
  - type: web
    name: diario-aventurero
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Campañas guardadas: cadena de conexión de Neon (Postgres gratis). Sin ella, las campañas viven en memoria.
      - key: DATABASE_URL
        sync: false
      # Traducción para teléfonos: pon UNA de las claves (GEMINI_API_KEY es gratis) en el panel de Render (Environment).
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: TR_CACHE_FILE
        value: /tmp/traducciones.json
