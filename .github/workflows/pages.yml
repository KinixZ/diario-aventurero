# Publica solo la web en GitHub Pages. Las salas necesitan el servidor (Render u otro):
# define la variable del repo SALA_URL (Settings → Secrets and variables → Actions → Variables),
# por ejemplo wss://diario-aventurero.onrender.com/ws
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-web.mjs
        env:
          SALA_URL: ${{ vars.SALA_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
