name: Pruebas
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sin paquete de 5etools en el repo, las pruebas de la web se saltan; las del servidor sí corren.
      - run: npm test
